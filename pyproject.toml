[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-cli"
dynamic = ["version"]
description = "Command-line tooling and a Python SDK for managing AutoDL instances."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["autodl", "gpu", "cli", "cloud", "instance"]
authors = [
    { name = "KrisTHL181", email = "KrisTHL181@outlook.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# click2mcp brings the `mcp` SDK and provides the typed-tool generator.
mcp = [
    "click2mcp>=0.1.0",
]
# desktop-notifier powers `tools snipe --notify` on Linux, macOS, and Windows.
notify = [
    "desktop-notifier>=6.0",
]
test = [
    "pytest>=8",
]

[project.scripts]
autodl = "autodl_cli.main:main"
autodl-mcp = "autodl_cli.mcp.server:main"

[project.urls]
Homepage = "https://github.com/KrisTHL181/autodl-cli"
Repository = "https://github.com/KrisTHL181/autodl-cli"
Issues = "https://github.com/KrisTHL181/autodl-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
# PyPI forbids local versions (+gHASH.dDATE); tag builds are unaffected
local_scheme = "no-local-version"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real AutoDL API; skipped unless --live is passed",
    "live_write: modifies a real AutoDL account; requires --live and --live-write",
]
